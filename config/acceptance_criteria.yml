# config/acceptance_criteria.yml
# ============================================================================
#  ESIKLER — SONUCTAN ONCE KILITLENIR (AGENTS.md Bolum 12.2)
# ============================================================================
#  BU DOSYA SONUC GORULDUKTEN SONRA DEGISTIRILEMEZ.
#  12.2 : esik saglanmazsa esik degistirilmez, failure raporlanir (12.6)
#  13.2-3: her asama sonunda `git diff` bu dosyada bos olmali, degilse FAIL
#  13.2-1: esikler KODA GOMULEMEZ, yalnizca buradan okunur
#  12.11 : degisiklik sadece kullanici onayi + DECISIONS.md kaydiyla
#
#  Asama: 0.1  |  Kilitleme: 2026-09-21
# ============================================================================

schema_version: 1
locked_at: "2026-09-21"

# Durum sozlugu:
#   LOCKED             : sayisal esik sabit, uygulanabilir
#   TODO_ONAY_BEKLIYOR : AGENTS.md sayi vermiyor; onaysiz sayi YAZILMAZ (Karar D-003)
#   QUALITATIVE        : sayisal esik degil, kanit dosyasiyla dogrulanir

global_rules:
  bias_with_rmse:
    rule: >
      Yukseklik ve enerji karsilastirmalarinda ortalama fark (bias / NMBE) HER ZAMAN
      RMSE ile BIRLIKTE raporlanir. Yalniz RMSE raporlamak yasaktir.
    reason: "Sistematik sapmayi toplu RMSE maskeler (Bolum 14.6)."
  rounding:
    rule: "Yuvarlayarak esik gecirmek yasak. Esik 0.25 m iken olcum 0.254 m ise FAIL (Bolum 13.3)."
  unmeasured:
    rule: "Olcum yapilamadiysa PASS verilmez; OLCULEMEDI yazilir ve nedeni aciklanir (13.3)."
  reporting_area:
    rule: "Metrikler yalnizca A alanindan hesaplanir. B simule edilir, RAPORLANMAZ (Bolum 3)."

# ============================================================================
stage_0_1:
  name: "Depo iskeleti"
  source: "Kullanici onayi 2026-09-21 (Bolum 6'da 0.1 icin sayisal kriter yoktu)"
  criteria:
    - id: "0.1-A"
      description: "Bolum 8'deki her dizin ve kok belge mevcut"
      metric: missing_paths_count
      comparator: "=="
      threshold: 0
      status: LOCKED
    - id: "0.1-B"
      description: "src/common/config.py uc yml dosyasini hatasiz yukluyor"
      metric: config_load_errors
      comparator: "=="
      threshold: 0
      status: LOCKED
    - id: "0.1-C"
      description: "logging_setup.py test satirini hem terminale hem dosyaya yaziyor"
      metric: log_sinks_working
      comparator: "=="
      threshold: 2
      status: LOCKED
    - id: "0.1-D"
      description: "git diff config/acceptance_criteria.yml bos (13.2-3)"
      metric: acceptance_criteria_diff_lines
      comparator: "=="
      threshold: 0
      status: LOCKED
    - id: "0.1-E"
      description: "Repoda secret yok (.env izlenmiyor, key deseni bulunmuyor)"
      metric: secrets_found
      comparator: "=="
      threshold: 0
      status: LOCKED

# ============================================================================
stage_0:
  name: "Veri edinimi"
  source: "AGENTS.md Bolum 6, Asama 0"
  evidence: data/DATA_LOG.md
  criteria:
    - id: "0-A"
      description: "Her katmanin CRS'i okundu ve beklenen CRS ile eslesti"
      metric: crs_mismatch_count
      comparator: "=="
      threshold: 0
      status: LOCKED
    - id: "0-B"
      description: "A alanindaki bina sayisi BAG'den sayildi ve loglandi"
      metric: building_count_area_a_logged
      comparator: "=="
      threshold: true
      status: LOCKED
      sanity_range: "400-700 (Bolum 3)"
      independent: false
      note: >
        sanity_range bir ESIK DEGILDIR, akil saglamasidir. Sayim bu araligin disinda
        cikarsa AOI siniri veya filtre sorgulanir; sayi degistirilmez.
      circularity_warning: >
        COZULDU (Karar D-009, 2026-09-21). D-007 doneminde AOI bu araliga girecek
        sekilde SECILECEKTI ve 0-B dongusel hale gelecekti. D-009 ile secim tamamen
        kaldirildi: A, resmi CBS buurt'larindan turetiliyor ve bina sayisi hicbir
        sekilde AOI'yi belirlemiyor. 0-B artik saf gozlemdir.
      threshold_status_note: >
        DIKKAT: 400-700 araligi ARTIK ESIK DEGILDIR (Karar D-009, kullanici talimati).
        A resmi sinirdan turedigi icin bina sayisi bir kabul kriteri degil, RAPORLANAN
        bir olcumdur. Olculen deger bu araligin disinda cikarsa bu bir BASARISIZLIK
        DEGILDIR; AGENTS.md Bolum 3'un tahmininin gercekle farki olarak raporlanir.
    - id: "0-C"
      description: "Eksik veya bozuk dosya yok"
      metric: corrupt_file_count
      comparator: "=="
      threshold: 0
      status: LOCKED
    - id: "0-D"
      description: "Her indirmenin SHA-256 checksum'i kayitli"
      metric: files_without_checksum
      comparator: "=="
      threshold: 0
      status: LOCKED

# ============================================================================
stage_1:
  name: "LOD2 rekonstruksiyon"
  source: "AGENTS.md Bolum 6, Asama 1"
  evidence: reports/01_geometry_validation.md
  criteria:
    - id: "1-A"
      description: "val3dity geometri gecerlilik orani"
      metric: val3dity_valid_pct
      comparator: ">="
      threshold: 97.0
      unit: pct
      status: LOCKED
      reference_note: "3DBAG genelinde 99.15 pct (Bolum 6)"
    - id: "1-B"
      description: "3DBAG ile cati yuksekligi RMSE"
      metric: roof_height_rmse_m
      comparator: "<="
      threshold: 0.25
      unit: m
      target: "0.10-0.20"
      status: LOCKED
      validation_label: consistency_check
      label_reason: >
        3DBAG de AHN + roofer ile uretiliyor; ayni ham veriden turemis iki cikti
        BAGIMSIZ ground truth sayilmaz (Bolum 5 ve 12.10). Bu bir tutarlilik
        kontroludur, bagimsiz dogrulama DEGILDIR.
      requires: "Bias ile birlikte raporlanir (global_rules.bias_with_rmse)"
    - id: "1-C"
      description: "AHN nokta bulutuna dogrudan z-fark analizi (BAGIMSIZ kontrol)"
      metric: ahn_z_diff_rmse_m
      comparator: "<="
      threshold: TODO_ONAY_BEKLIYOR
      unit: m
      status: TODO_ONAY_BEKLIYOR
      decision_ref: D-003
      blocking_for: "Asama 1 baslangici"
      proposal_note: >
        Bolum 4: resmi AHN kalite belgesi duseyde sistematik <=5 cm ve stokastik
        sigma <=5 cm veriyor; AHN5 ihale belgesi sigma <=3 cm diyor. Bu CELISKI
        raporda acikca not dusulecek, sessizce tek deger secilmeyecek. Esik bu
        celiski kullaniciyla cozulmeden sayisallastirilmaz.
    - id: "1-D"
      description: "Basarisiz rekonstruksiyon orani"
      metric: failed_reconstruction_pct
      comparator: "<="
      threshold: 2.0
      unit: pct
      status: LOCKED
      evidence: reports/failed_buildings.csv
      note: "Bolum 12.8 — her atlanan kayit CSV'ye yazilir, sessiz atlama yasak."

# ============================================================================
stage_2:
  name: "Semantik veritabani"
  source: "AGENTS.md Bolum 6, Asama 2"
  criteria:
    - id: "2-A"
      description: "A alanindaki her bina sorgulanabilir"
      metric: unqueryable_buildings_area_a
      comparator: "=="
      threshold: 0
      status: LOCKED
    - id: "2-B"
      description: "BAG identificatie ID kaybi yok (import oncesi = sonrasi)"
      metric: id_loss_count
      comparator: "=="
      threshold: 0
      status: LOCKED
      note: "Bolum 14.6 sessiz veri kaybi — her join oncesi/sonrasi satir sayisi loglanir."
    - id: "2-C"
      description: "Belirsiz / coklu adresli vakalar ayri raporlandi"
      metric: ambiguous_address_report_exists
      comparator: "=="
      threshold: true
      status: QUALITATIVE
      note: "Bolum 12.3 — sessizce bir secenek secilmez."

# ============================================================================
stage_3:
  name: "Gunes + enerji (CEKIRDEK)"
  source: "AGENTS.md Bolum 6, Asama 3"
  evidence: reports/03_energy_validation.md

  matching_method:
    energy_comparison_level: PC6_cluster
    rule: >
      Stedin PC6 verisi bina duzeyinde olcum DEGILDIR (satir basina en az 10 baglanti
      birlestirilmis anonim agregat). PC6 tuketimi HICBIR KOSULDA tek bir binaya
      atanmaz. Model ciktisi da ayni PC6 kumesine toplanir; karsilastirma iki
      AGREGAT arasindadir.
    forbidden_phrase: "PC6 ground truth"
    correct_phrase: "PC6 duzeyinde agregat karsilastirma"
    required_reporting:
      - "Her PC6'daki bina sayisi"
      - "Konut disi kullanim orani"
      - "Bosluk (vacancy) durumu"
    eponline_matching: "BAG pand -> verblijfsobject -> adresseerbaar object -> EP-Online label"
    documented_in: docs/validation_protocol.md

  archetype_rule:
    rule: >
      5-8 arsetip (bouwjaar + gebruiksdoel + bina tipi), her biri bir kez EnergyPlus'ta
      simule edilir ve geometriyle olceklenir. 400-700 bina TEK TEK SIMULE EDILMEZ.
    source: "AGENTS.md Bolum 6, Asama 3"

  criteria:
    - id: "3-A"
      description: "PVGIS karsilastirmasinda ayni fiziksel buyukluk kullanildigi gosterildi"
      metric: same_quantity_proof_documented
      comparator: "=="
      threshold: true
      status: QUALITATIVE
      evidence: docs/validation_protocol.md
      note: >
        Bolum 12.4 — SOLWEIG/UMEP yuzeye gelen isinim uretir; PVGIS belirli bir PV
        sistem konfigurasyonunun uretimini verir. Dogrudan esitlenemez. Donusum
        gosterilemezse kiyas contextual_comparison olarak etiketlenir.
    - id: "3-B"
      description: "PC6 duzeyinde NMBE"
      metric: nmbe_pct
      comparator: "abs<="
      threshold: TODO_ONAY_BEKLIYOR
      unit: pct
      status: TODO_ONAY_BEKLIYOR
      decision_ref: D-003
      blocking_for: "Asama 3 baslangici"
      proposal_note: >
        Bolum 9 referans olarak ASHRAE Guideline 14'u gosteriyor fakat sayisal esik
        VERMIYOR. Kullanici Asama 3 baslamadan once kaynak gostererek onaylar;
        onaylanan deger DECISIONS.md'ye kaynagiyla yazilir.
    - id: "3-C"
      description: "PC6 duzeyinde CV(RMSE)"
      metric: cv_rmse_pct
      comparator: "<="
      threshold: TODO_ONAY_BEKLIYOR
      unit: pct
      status: TODO_ONAY_BEKLIYOR
      decision_ref: D-003
      blocking_for: "Asama 3 baslangici"
    - id: "3-D"
      description: "PC6 sapma dagilim grafigi uretildi"
      metric: deviation_distribution_plot_exists
      comparator: "=="
      threshold: true
      status: QUALITATIVE
    - id: "3-E"
      description: "EP-Online etiket dagilimi ile model tutarliligi kontrol edildi"
      metric: eponline_consistency_checked
      comparator: "=="
      threshold: true
      status: QUALITATIVE

# ============================================================================
stage_4:
  name: "Ikincil moduller"
  source: "AGENTS.md Bolum 6, Asama 4"
  blocked_by: "Donanim karari — B ve D boyutlari sabitlenmeden BASLANMAZ (Bolum 3)"
  criteria:
    - id: "4-A"
      description: "Her modul icin girdi, cozum ayarlari ve sinirlamalar belgelendi"
      metric: module_documentation_complete
      comparator: "=="
      threshold: true
      status: QUALITATIVE
    - id: "4-B"
      description: "CFD icin Bolum 12.9 listesi eksiksiz"
      metric: cfd_qa_checklist_items_missing
      comparator: "=="
      threshold: 0
      status: LOCKED
      checklist:
        - hesaplama_domeni
        - mesh_cozunurlugu
        - mesh_bagimsizlik_calismasi
        - sinir_kosullari
        - giris_ruzgar_profili
        - turbulans_modeli
        - yuzey_puruzlulugu
        - y_plus_degerleri
        - solver_ayarlari
        - residual_kriterleri
        - kutle_korunumu
        - yakinsama_gecmisi
      note: "Bolum 12.9 — solver yakinsamasi TEK BASINA kabul gerekcesi DEGILDIR."

  validation_labels:
    flood_module: screening
    flood_forbidden_phrases:
      - "dogrulanmis hidrolik sel modeli"
      - "sel tahmini"
    flood_note: >
      AHN DTM tabanli topografik screening. Klimaateffectatlas ile yalnizca GORSEL
      karsilastirma (Bolum 5 ve 12.5).
    wind_module: literature_consistent
    wind_note: "Bagimsiz acik CFD benchmark zayif; sonuc en fazla NEN 8100 literaturuyle tutarli."
    lst_module: contextual_comparison
    lst_note: >
      Landsat LST = YUZEY sicakligi, ENVI-met HAVA sicakligi uretir; dogrudan
      kiyaslanmaz (12.4). Landsat termal gercekte 100 m, 30 m'ye resample edilmistir.

# ============================================================================
stage_5:
  name: "Yayin"
  source: "AGENTS.md Bolum 6, Asama 5"
  criteria:
    - id: "5-A"
      description: "Arayuz A alanini sorunsuz yukluyor"
      metric: interface_loads_area_a
      comparator: "=="
      threshold: true
      status: QUALITATIVE
    - id: "5-B"
      description: "Gosterilen her deger bir kaynaga VE dogrulama durumuna bagli"
      metric: values_without_provenance
      comparator: "=="
      threshold: 0
      status: LOCKED
    - id: "5-C"
      description: "Lisans / attribution sartlari karsilaniyor (3DBAG CC BY 4.0 dahil)"
      metric: attribution_complete
      comparator: "=="
      threshold: true
      status: QUALITATIVE
      note: >
        Bolum 7: bir bilesenin lisansi web arayuzunun yayinini engelliyorsa YAYIN
        ASAMASINA GECILMEZ, durum raporlanir.

# ============================================================================
#  ASAMA 0.2a — AOI aday secimi (Karar D-007)
#  Bu blok ADAY HESABINDAN ONCE ayri bir commit ile muhurlenmistir.
#  Esiklerin sonuclardan once sabitlendigi git gecmisinden kanitlanabilir.
# ============================================================================
stage_0_2:
  name: "AOI aday secimi"
  source: "Karar D-007, kullanici onayi 2026-09-21"
  method: rule_based_grid_search

  # ========================================================================
  status: SUPERSEDED
  superseded_by: D-009
  superseded_at: "2026-09-21"
  superseded_reason: >
    Aday izgarasi ve kor karsilastirma IPTAL EDILDI. A artik aranmiyor, resmi
    birimlerden turetiliyor (bkz. aoi_definition). Secimde oznel karar kalmadigi
    icin dogrulanacak bir secim de kalmadi.
    Bu blok SILINMEDI: esiklerin sonuctan once kilitlendigi ve sonradan
    degistirilmedigi izi korunuyor (Bolum 12.2). Kriterleri ARTIK UYGULANMAZ.
  never_executed: >
    Bu bloktaki kriterlerle HICBIR aday hesabi calistirilmadi. aoi/candidates/
    hicbir zaman olusturulmadi. Esikler uretilmis bir sonuca gore degistirilmedi
    cunku uretilmis sonuc yoktur.
  # ========================================================================

  # --- Arama alani ---
  study_area:
    source: "CBS Wijken en Buurten 2025 (PDOK WFS)"
    wijkcode: "WK050324"
    wijknaam: "Wijk 24 Voorhof"
    note: "Ad 'Voorhof' DEGIL 'Wijk 24 Voorhof'. Tam esleme sorgusu 0 kayit donduru (M-004)."
    crs: "EPSG:28992"

  # --- Izgara ve kare ---
  grid:
    spacing_m: 25
    square_side_m: 600
    candidate_origin: "Izgara noktalari Voorhof poligonu ICINDE olmak zorunda"
    crs: "EPSG:28992"

  # --- STATUS FILTRESI (Karar D-008, kullanici talimati 2026-09-21) ---
  # Deger listeleri INDIRILEN VERIDEN dogrulanmistir, tahmin edilmemistir (M-005 kurali).
  status_filter:
    enabled: true
    pand_field: status
    vbo_field: status
    pand_include:
      - "Pand in gebruik"                   # 7576 (%98.34)
      - "Pand in gebruik (niet ingemeten)"  #    4 (%0.05)
      - "Verbouwing pand"                   #   77 (%1.00) — bkz. renovation_note
    pand_exclude:
      - "Bouwvergunning verleend"           #   31 (%0.40) — henuz insa edilmemis
      - "Bouw gestart"                      #   15 (%0.19) — insaat devam ediyor
      - "Sloopvergunning verleend"          #    1 (%0.01) — yikim izni verilmis
    vbo_include:
      - "Verblijfsobject in gebruik"        # 18644 (%96.37)
      - "Verbouwing verblijfsobject"        #    34 (%0.18) — bkz. renovation_note
    vbo_exclude:
      - "Verblijfsobject gevormd"           #   668 (%3.45) — kayden olusmus, henuz kullanimda degil
    renovation_note: >
      "Verbouwing pand" ve "Verbouwing verblijfsobject" DAHIL EDILDI. Kullanicinin
      literal listesi bunlari saymiyordu, ancak belirtilen amac fiilen var olmayan
      yapilari dislamakti; tadilattaki bir bina fiziksel olarak MEVCUTTUR ve catisi
      gunes/golge analizine girer. Dislansaydi 77 gercek bina (%1,0) sayim disi
      kalirdi. Bu okuma kullanici tarafindan ONAYLANDI (2026-09-21, P-008 kapandi).
    gesloopt_note: >
      Kullanici "BAG WFS yikilmis binalari da iceriyor" demisti. OLCUM: indirilen
      7704 pand icinde "Pand gesloopt" veya benzeri yikilmis durum kaydi YOKTUR.
      PDOK bu WFS'te yikilmis nesneleri sunmuyor (veya bu bbox'ta yok). Filtre yine de
      yazildi — hem henuz insa edilmemis yapilari disliyor hem de veri surumu
      degisirse savunma saglıyor.
    measured_at: "2026-09-21, indirilen bbox geneli"
    applies_to: [0.2-A, 0.2-B, bouwjaar_1960_1975_ratio_pct, panden_with_dwellings]

  # --- SAYIM KURALI (kullanicinin acik talimati) ---
  counting_rule:
    method: pand_centroid_in_square
    description: >
      Bir BAG pand, yalnizca CENTROID'i 600 m karenin icindeyse sayilir.
      Kesisim (intersects) KULLANILMAZ. Gerekce: kesisim kurali sinirdaki binalari
      birden fazla adaya saydirir ve kenar karelerin sayimini sisirir.
    geometry_source: "BAG pand geometrisi, EPSG:28992"

  # --- Filtre kriterleri: adayin GECMESI icin hepsi saglanmali ---
  criteria:
    - id: "0.2-A"
      description: "Karedeki BAG pand sayisi (centroid kurali)"
      metric: building_count
      comparator: "between"
      threshold: [400, 700]
      status: LOCKED
      source: "AGENTS.md Bolum 3"
      denominator: all_panden          # Karar D-008
      denominator_note: >
        TUM panden sayilir; konut birimi icermeyen yardimci yapilar (garaj, trafo,
        depo, otopark) DAHILDIR. Gerekce: indirilen alanda yogunluk 1852 pand/km2
        oldugundan 600x600 m kare basina ~667 pand duser ve Bolum 3'un verdigi
        400-700 araligina dogal olarak oturur. Yalnizca konutlu panden sayilsaydi
        kare basina ~337 dusecek ve alt sinirin altinda kalacakti.
    - id: "0.2-B"
      description: "woonfunctie orani"
      metric: woonfunctie_ratio_pct
      comparator: ">="
      threshold: 90.0
      unit: pct
      status: LOCKED
      source: "AGENTS.md Bolum 2 (%90+ konut)"
      denominator: verblijfsobjecten_of_panden_in_square   # Karar D-008
      woonfunctie_rule: exact_match                        # Karar D-008
      computation: >
        Karedeki panden'a (centroid kurali) pandidentificatie ile baglanan
        VERBLIJFSOBJECT'ler toplanir; bunlardan gebruiksdoel'u TAM OLARAK
        "woonfunctie" olanlarin orani hesaplanir. Coklu islevli kayitlar
        ("woonfunctie,winkelfunctie" gibi) konut SAYILMAZ.
        Join oncesi ve sonrasi satir sayisi loglanir (Bolum 14.6 sessiz veri kaybi).
      computation_correction: >
        DUZELTME (MISTAKES.md M-005): Bu alan daha once "gebruiksdoel BAG pand
        uzerinde DEGIL" diyordu. Bu YANLISTIR — PDOK'un bag:pand katmani gebruiksdoel,
        bouwjaar ve aantal_verblijfsobjecten alanlarini tasir. Iddia, BAG'in kavramsal
        veri modelinden turetilmis ama servisin semasindan dogrulanmamisti.
      why_not_pand_level: >
        VBO duzeyi, pand duzeyi dogru olmadigi icin degil, pand duzeyi KULLANILAMAZ
        oldugu icin secildi: indirilen panden'in %40,6'si (3124 adet)
        aantal_verblijfsobjecten = 0 olan yardimci yapilardir ve gebruiksdoel'leri
        bostur. Pand duzeyinde oran %50,5'te kalir; >=%90 esigi hicbir karede
        saglanamaz ve secim sifir aday uretirdi.
    - id: "0.2-C"
      description: "Karenin Voorhof siniri icinde kalan alan orani"
      metric: inside_wijk_area_pct
      comparator: ">="
      threshold: 80.0
      unit: pct
      status: LOCKED

  # --- Olculen referans dagilimlar (indirilen bbox geneli, 2026-09-21) ---
  # Kare bazinda DEGIL; metrik tanimini netlestirmek icin olculdu (Karar D-008).
  # Aday skoru uretilmeden once olculmustur — Bolum 12.2 ihlali yoktur.
  measured_context:
    download_bbox: "Voorhof + 300 m tampon, 1713 x 2428 m"
    total_panden: 7704
    total_verblijfsobjecten: 19346
    panden_without_dwelling: 3124        # %40.6 — garaj, trafo, depo, otopark
    woonfunctie_pct_pand_level: 50.5
    woonfunctie_pct_vbo_level: 93.2
    bouwjaar_1960_1975_pct_pand_level: 22.2
    bouwjaar_1960_1975_pct_vbo_level: 48.5
    multifunction_vbo_count: 61          # %0.32
    vbo_to_pand_join_match_pct: 100.0

  # --- Raporlanan ama filtrelemeyen metrikler ---
  reported_metrics:
    - metric: bouwjaar_1960_1975_ratio_pct
      unit: pct
      denominator: verblijfsobjecten_of_panden_in_square   # Karar D-008, 0.2-B ile ayni birim
      note: >
        Filtre DEGIL, ama bilesik skora girer. AGENTS.md Bolum 2 arsetip kohortu.
        Payda kriter 0.2-B ile AYNI birimdedir (VBO). Gerekce: bilesik skorda
        toplanan iki oran farkli paydalara sahip olursa skor yorumlanamaz hale gelir.
        Olculen fark buyuktur: bbox genelinde pand duzeyi %22,2, VBO duzeyi %48,5."
    - metric: total_verblijfsobjecten
    - metric: mean_bouwjaar
    - metric: panden_with_dwellings
      definition: "aantal_verblijfsobjecten > 0 olan pand sayisi (status filtresi uygulanmis)"
      note: >
        ESIK DEGIL, raporlanir (Karar D-008, kullanici talimati). Gerekce: Asama 3
        enerji dogrulamasinin ORNEKLEMI bu kumedir — yardimci yapilarin (garaj, trafo,
        depo) enerji modeli yoktur. Toplam pand sayisi (kriter 0.2-A) ile birlikte
        raporlanir; ikisi arasindaki fark alanin yardimci yapi yogunlugunu gosterir.
    - metric: excluded_by_status_count
      definition: "Status filtresiyle dislanan pand ve VBO sayisi"
      note: "Sessiz atlama yasagi (Bolum 12.8) — her dislanan kayit sayilir ve raporlanir."

  # --- SIRALAMA (hesaptan once kilitli) ---
  ranking:
    method: composite_score
    formula: "(woonfunctie_ratio_pct + bouwjaar_1960_1975_ratio_pct + inside_wijk_area_pct) / 3"
    weights:
      woonfunctie_ratio_pct: 0.3333333333
      bouwjaar_1960_1975_ratio_pct: 0.3333333333
      inside_wijk_area_pct: 0.3333333333
    note: >
      Esit agirlik, kullanici onayi 2026-09-21. Gerekce: AGENTS.md Bolum 2 uc kriteri
      ayni anda istiyor — konut dokusu (PC6 karsilastirmasi icin), tek yapim-yili
      kohortu (arsetip icin), sinir icinde kalma (homojenlik).

  # --- Aday ayrikligi ---
  candidate_separation:
    min_distance_m: 300
    rationale: >
      600 m kenarli karelerin en fazla %50 ortusmesi demek. Bu kisit olmadan en iyi 3
      aday komsu izgara hucreleri olur ve "3 aday arasindan secim" illuzyon olurdu.
    n_candidates: 3
    if_insufficient: >
      300 m ayriklikla 3 aday bulunamazsa DAHA AZ aday raporlanir. Ayriklik esigi
      sonuc gorulduikten sonra DUSURULMEZ (Bolum 12.2).

  # --- Cikti ---
  outputs:
    candidates_dir: aoi/candidates
    report: reports/00_stage_0_2a_candidates.md
    blind_protocol: >
      Aday ciktilari, kullanicinin QGIS'te bagimsiz sectigi merkez commit'lenene kadar
      repoya YAZILMAZ ve kullaniciya GOSTERILMEZ (Karar D-007).

  # --- Bilinen veri kaynagi sinirlamasi (Karar D-008) ---
  known_source_limitation:
    source: "PDOK BAG WFS v2_0"
    issue: >
      Bu WFS, BAG'in KISMI bir secimidir; coklu adresli nesnelerde yalnizca HOOFDADRES
      sunulur (nevenadressen yok).
    impact_stage_0_2: >
      YOK/ihmal edilebilir. 0.2a bina sayimi ve woonfunctie orani icin hoofdadres
      yeterlidir; bir VBO'nun kac adresi oldugu bu metrikleri degistirmez.
    impact_stage_2: >
      CIDDI OLABILIR. Bolum 12.3'un EP-Online eslestirmesi
      "BAG pand -> verblijfsobject -> adresseerbaar object -> EP-Online label"
      hiyerarsisini gerektirir. Nevenadres eksikligi, coklu adresli nesnelerde
      eslesmeyi eksik birakabilir. Bolum 12.3 bu vakalarin "ayri raporlanmasini"
      zorunlu kiliyor; sessizce bir secenek secilemez.
    mitigation: >
      Asama 2'ye gecmeden once tam BAG dagitimi (ATOM/LVBAG extract) ile bu WFS
      karsilastirilir; fark olculur ve raporlanir. Bkz. PENDING_DECISIONS -> P-007.

  # --- Indirme kapsami ---
  download_extent:
    rule: "Voorhof bbox + 300 m tampon"
    rationale: >
      Merkezi Voorhof icinde olan bir 600 m kare sinirdan 300 m disari tasabilir.
      Tamponsuz indirme kenar adaylarin bina sayimini eksik gosterir ve secimi
      sistematik olarak merkeze kaydirir.
    note: "Bu tampon 0.2a'ya ozgudur. Asama 0.3 indirmeleri D-006 uyarinca B alani bbox'i ile sinirlanir."

# ============================================================================
#  AOI TANIMI (Karar D-009, kullanici onayi 2026-09-21)
#  A aranmaz, TURETILIR. Oznel karar yoktur; elle cizilmis hicbir cizgi yoktur.
# ============================================================================
aoi_definition:
  decision_ref: D-009
  crs: "EPSG:28992"

  area_a:
    name: "Analiz alani"
    method: union_of_official_buurten
    source: "CBS Wijken en Buurten 2025, wijkcode WK050324"
    rule: >
      A = WK050324'un 9 buurt'undan, sanayi/is alani olan 2 tanesi DISINDA kalan
      7 buurt'un birlesimi. Sinir tamamen resmi birimlerden turer; elle cizim yoktur,
      dolayisiyla tekrarlanabilirdir ve AOI'yi "sonuc iyi ciksin diye" secme
      yanliligi tasimaz.
    included_buurtcodes:          # veriden dogrulandi 2026-09-21, 7 adet
      - "BU05032400"   # Poptahof-Noord
      - "BU05032401"   # Poptahof-Zuid
      - "BU05032403"   # Mythologiebuurt
      - "BU05032404"   # Aart van der Leeuwbuurt
      - "BU05032405"   # Roland Holstbuurt
      - "BU05032406"   # Voorhof-Hoogbouw
      - "BU05032407"   # Multatulibuurt
    excluded_buurten:
      - code: "BU05032402"
        name: "Bedrijventerrein Voorhof"
        area_ha: 10
        reason: "Sanayi/is alani — konut dokusu degil"
      - code: "BU05032408"
        name: "Bedrijventerrein Vulcanusweg"
        area_ha: 7
        reason: "Sanayi/is alani — konut dokusu degil"
    exclusion_rationale: >
      AGENTS.md Bolum 2: PC6 agregat enerji karsilastirmasi "SADECE HOMOJEN KONUT
      DOKUSUNDA anlamlidir". Iki bedrijventerrein WK050324'un %13,5'ini kapliyor ve
      konut disi tuketim profili tasiyor; A icinde birakilsalardi Bolum 12.3'un
      PC6 karsilastirmasi karma bir dokuyu olcerdi.
    known_risk: >
      Sinir artik tek bir resmi birim degil, resmi birimlerden TURETILMIS bir
      birlesimdir. Bir PC6 kumesi dislanan buurt'larla A arasinda bolunuyorsa
      Bolum 12.3 karsilastirmasi karisir. Asama 3'te PC6 sinirlari A ile kesistirilip
      bolunmus PC6'lar AYRI RAPORLANIR; sessizce bir tarafa atanmaz.
      Bkz. reports/PENDING_DECISIONS.md -> P-009.

  area_b:
    name: "Baglam / tampon"
    method: buffer
    rule: "B = A.buffer(300)"
    buffer_m: 300
    source: "AGENTS.md Bolum 3 (A + ~300 m halka)"
    note: >
      Programatik uretilir, elle cizilmez. B SIMULE EDILIR, RAPORLANMAZ (Bolum 3).
      Tamponsuz simulasyonda kenar binalar golgelenmemis gorunur ve gunes potansiyeli
      SISTEMATIK OLARAK YUKSEK cikar.
    contains_industry: >
      B, A'dan dislanan iki bedrijventerrein'i buyuk olcude tekrar icine alir.
      BU DOGRUDUR VE ISTENIR: o binalar golge ve ruzgar geometrisine katkida bulunur.
      Dislama yalnizca RAPORLANAN alan (A) icin gecerlidir.

  area_c:
    name: "Mikroklima alt-alani"
    size_m: [150, 150]
    method: manual_user_selection
    status: TODO_ASAMA_4
    note: "A icinde kullanici secer (ENVI-met LITE 50x50x25 grid siniri)."

  area_d:
    name: "CFD domeni"
    method: "COST 732 / AIJ: giris 5H, cikis 15H, yanlar/ust 5H"
    status: TODO_ASAMA_3_SONU
    blocked_by: "H (en yuksek bina) henuz olculmedi — P-001"

  # --- Raporlanan metrikler (ESIK DEGIL - Karar D-009) ---
  reported_metrics:
    - building_count
    - panden_with_dwellings
    - woonfunctie_ratio_pct
    - bouwjaar_1960_1975_ratio_pct
    - total_verblijfsobjecten
  metric_definitions: "stage_0_2 altindaki D-008 paydalari ve status_filter aynen gecerlidir"
  no_thresholds: >
    Bu metriklerin HICBIRI icin PASS/FAIL beyan edilmez. A resmi birimlerden
    turedigi icin bunlar kabul kriteri degil, alanin tanimlayici olcumleridir.

# ============================================================================
#  ROL OZNITELIGI ve ETIKETLEME (Karar D-009)
#  Sanayi buurt'lari MODELDEN CIKARILMIYOR; yalnizca A'nin raporlama ve
#  dogrulama kapsamindan cikiyor.
# ============================================================================
building_roles:
  decision_ref: D-009
  attribute_name: role
  written_in: "Asama 2, 3DCityDB — her binaya kalici oznitelik"
  values:
    analysis:
      rule: "pand centroid'i A icinde"
      reported: true
      in_validation: true
      note: "Bina istatistikleri, enerji karsilastirmasi ve kabul kriterleri YALNIZCA bunlardan hesaplanir."
    context:
      rule: "pand centroid'i B icinde, A disinda (sanayi buurt'lari dahil)"
      reported: false
      in_validation: false
      note: >
        LOD2 rekonstruksiyonuna girer, 3B modelde yer alir, golge/gunes ve CFD
        hesaplarina GIRDI olur. A'nin dogrulama istatistiklerine girmez.
        Web arayuzunde farkli stilde gosterilir.

  # --- Cikti alanlarinin rol bazinda ele alinisi ---
  solar:
    analysis: {computed: true, label: null, in_validation_stats: true}
    context:  {computed: true, label: indicative, in_validation_stats: false}
    rationale: >
      Cati gunes potansiyeli bir FIZIKSEL BUYUKLUKTUR ve binanin kullanim tipinden
      bagimsizdir. Context binalari icin de hesaplanir ve ikizde gosterilir, ancak
      "indicative" etiketiyle ve A'nin dogrulama istatistiklerine KATILMADAN
      (Bolum 12.5 etiketleme kurali).
  energy:
    analysis: {computed: true, scope: residential_only}
    context:
      computed: false
      display_value: "modellenmedi"
      display_reason: "endustriyel surec yuku acik veriyle bilinemez"
    rationale: >
      Enerji tuketimi yalnizca konut binalari icin hesaplanir. Sanayi/context
      binalarinda alan BOS BIRAKILMAZ — acik gerekceyle isaretlenir. Bos alan
      "hesaplanmadi" ile "sifir" arasindaki farki gizler; Bolum 1 kural 5
      (belirsizligi gizleme) bunu yasaklar.

# ============================================================================
#  C ALANI SECIM KURALLARI (Karar D-011)
#  MUHURLENDI 2026-09-21 - aday hesabi CALISTIRILMADI.
#  Hesap Asama 0.3'te, 3DBAG yukseklik verisi geldikten sonra TEK SEFERDE
#  yapilacak (kullanici talimati: iki kez secim yapmamak icin).
# ============================================================================
stage_0_2_c:
  name: "C alani (mikroklima) kural tabanli secim"
  decision_ref: D-011
  status: SEALED_NOT_EXECUTED
  sealed_at: "2026-09-21"
  execute_at: "Asama 0.3 sonrasi (3DBAG b3_h_dak_max gerekiyor)"
  crs: "EPSG:28992"

  geometry:
    side_m: 150
    axis_aligned: true
    rotation: "Asama 4'te degerlendirilecek; 0.2'de dondurme YOK"
    grid_step_m: 10

  # --- Birincil kural seti ---
  rules_primary:
    - id: "C-1"
      rule: "Kare tamamen A icinde"
    - id: "C-2"
      rule: "Kare sinirindan A sinirina en az 50 m"
    - id: "C-3"
      rule: "Kare SINIRINI kesen pand yok (kucuk yardimci yapilar haric - bkz. auxiliary_building)"
    - id: "C-4"
      rule: "Kare icinde konut disi gebruiksdoel tasiyan VBO yok"
      excluded_gebruiksdoel: >
        woonfunctie DISINDAKI her deger: onderwijsfunctie, gezondheidszorgfunctie,
        bijeenkomstfunctie, winkelfunctie, kantoorfunctie, industriefunctie,
        sportfunctie, logiesfunctie, celfunctie, overige gebruiksfunctie.
        Coklu islevli (virgullu) kayitlar da konut disi sayilir - D-008'in
        exact_match kuralinin C icin karsiligi.
      user_note: "Kullanici QGIS denemesinde De Eglantier okulunun (onderwijsfunctie) kareye girdigini gozlemledi."
    - id: "C-5"
      rule: "Kare icinde en az 2 konutlu pand (aantal_verblijfsobjecten > 0)"
    - id: "C-6"
      rule: "TODO_ONAY_BEKLIYOR - yukseklik kurali, bkz. height_rule"
      status: TODO_ONAY_BEKLIYOR

  # --- Yardimci yapi tanimi (OLCULDU, tahmin edilmedi) ---
  auxiliary_building:
    definition: "aantal_verblijfsobjecten == 0  AND  taban_alani_m2 < 50"
    measured_evidence:
      a_panden_total: 1259
      without_dwellings: 361
      without_dwellings_p50_m2: 9.2
      without_dwellings_p95_m2: 16.5
      without_dwellings_p99_m2: 85.3
      without_dwellings_max_m2: 266.6
      coverage_at_50m2_pct: 98
    rationale: >
      Kullanici "taban alani < 30 m2" onermisti. OLCUM BUNU CURUTTU: A'daki
      KONUTLU panden'in %16,9'u (152 adet) 30 m2'nin altindadir - saf alan esigi
      152 gercek evi "yok sayilabilir yardimci yapi" ilan ederdi.
      Dogru ayirici zaten elimizdedir: aantal_verblijfsobjecten == 0, yani
      "icinde konut birimi yok". Alan siniri yalnizca GUVENLIK KAPAGIDIR:
      konutsuz panden'in en buyugu 266,6 m2'dir (otopark/trafo yapisi olabilir)
      ve boyle bir yapi mikroklimayi etkiler, sinirdan gecirilmemelidir.
      50 m2 siniri konutsuzlarin %98'ini kapsar.

  # --- Temsil edicilik skoru (referans: A GENELI, kullanici onayi) ---
  representativeness:
    reference: a_wide_values
    metrics:
      - name: building_density
        definition: "kare icindeki pand taban alani toplami / kare alani"
        a_reference_value: 0.1755
        measured_at: "2026-09-21"
      - name: bouwjaar_1960_1975_ratio_pct
        definition: "kare icindeki panden'a bagli VBO'lardan 1960-1975 olanlarin orani"
        a_reference_value: 75.1
        measured_at: "2026-09-21"
    score: "iki metrigin A referansindan MUTLAK SAPMASININ normalize toplami; KUCUK olan daha iyi"
    normalisation: "her metrik kendi gecerli-aday dagiliminin std'sine bolunur"
    rationale: >
      Referans A geneli degerdir, aday kumesinin medyani DEGIL (kullanici onayi
      2026-09-21). Gerekce: medyan referansi aday kumesine baglar; kural degisirse
      referans da kayar ve sonuclar karsilastirilamaz hale gelir.

  candidate_separation:
    min_center_distance_m: 150
    n_candidates: 3
    note: "150 m ayriklik, 150 m kenarli karelerin HIC ortusmemesi demektir."

  # --- ON-KAYITLI YEDEK SET (sonuc gorulmeden yazildi) ---
  # Bolum 12.2: esik sonuctan sonra gevsetilemez. Bu yedek, birincil set sifir
  # aday verirse uygulanmak uzere HESAPTAN ONCE kayda gecirilmistir.
  fallback:
    trigger: "rules_primary ile gecerli aday sayisi == 0"
    change: "C-3 degisir: 'kare sinirini kesen pand yok' -> 'ic 120x120 m cekirdegi kesen pand yok'"
    core_side_m: 120
    rationale: >
      Dis 15 m serit ENVI-met sonuclarinda zaten YORUMLANMAYACAKTIR
      (bkz. docs/validation_protocol.md, analysis_margin). O seridi kesen bir bina,
      yorumlanan cekirdegi etkilemez. Gevsetme bu nedenle fiziksel olarak
      savunulabilir ve post-hoc DEGILDIR - sonuc gorulmeden yazilmistir.
    reporting: "Hangi setin uygulandigi raporda ACIKCA belirtilir."
    if_both_fail: "Bolum 12.6 failure raporu yazilir, durulur. Kural KENDILIGINDEN daha fazla gevsetilmez."

  # --- YUKSEKLIK KURALI - 0.3'te eklenecek, ONAY BEKLIYOR ---
  height_rule:
    status: TODO_ONAY_BEKLIYOR
    decision_ref: D-011
    data_needed: "3DBAG b3_h_dak_max (Asama 0.3'te inecek)"
    blocking_for: "C aday hesabi"

    envimet_documented_facts:
      lite_grid_limit: "50 x 50 x 25 hucre"
      model_top_rule: "Model yuksekligi, en yuksek binanin EN AZ 2 KATI ve en az 30 m olmali"
      telescoping_rule: >
        Telescoping ancak en yuksek bina yuksekliginden ITIBAREN baslayabilir;
        aksi halde binalar dogru gridlenmez.
      splitting_note: "Yaya seviyesi cozunurlugu icin en alt hucre bolunebilir; bu dikey hucre butcesini etkiler."
      source: "envi-met.info bilgi bankasi (Total Model Height, Vertical Grid Layout) + envi-met.com LITE surum tanimi"
      verified_at: "2026-09-21"

    derived_proposal:
      note: >
        Asagidaki aritmetik AJAN TARAFINDAN TURETILMISTIR; belgelenmis bir sayi
        DEGILDIR. Turetme yalnizca yukaridaki belgelenmis kurallara dayanir ve
        DUZGUN (uniform) dikey grid varsayar.
      uniform_grid_bound:
        - target_dz_m: 2.0
          model_height_m: 50.0
          max_building_height_m: 25.0
        - target_dz_m: 3.0
          model_height_m: 75.0
          max_building_height_m: 37.5
      recommended_max_building_height_m: 25.0
      recommended_rationale: >
        dz <= 2 m hedefi, duzgun grid ve belgelenmis "2 kat" kurali birlikte
        H_max <= 25 m verir. Telescoping bu siniri yukari cekebilir, ANCAK
        telescoping buyume katsayisi belgeden dogrulanamadi; dogrulanmamis bir
        katsayiya dayali esik onerilmez (M-005 kurali).
      known_risk: >
        Voorhof-Hoogbouw buurt'unda (BU05032406) yuksek bloklar bulunuyor.
        H_max <= 25 m kurali A'nin bu bolumunu C adayi olmaktan cikarabilir.
        Bu KABUL EDILEBILIR bir sonuctur - C, A'yi temsil eden bir ALT-ALANDIR,
        A'nin tamami degildir. Ancak yuksek bloklar tamamen dislanirsa C'nin
        A'yi temsil etme iddiasi zayiflar ve bu SINIRLAMA olarak raporlanir.

# ============================================================================
#  C ALANI YUKSEKLIK KURALI (Karar D-012) — MUHURLENDI 2026-09-21
#  Kullanici onayi: birincil 25 m, yedek 37,5 m.
#  HESAP CALISTIRILMADI. Yukseklik verisi (3DBAG) henuz indirilmedi; bu blok
#  A'nin yukseklik dagilimi GORULMEDEN yazilmistir — gercek bir on-kayittir.
# ============================================================================
stage_0_2_c_height:
  decision_ref: D-012
  status: SEALED_NOT_EXECUTED
  sealed_at: "2026-09-21"
  execute_at: "Asama 0.3 sonrasi"
  data_needed:
    - "3DBAG b3_h_dak_max  (cati maks yukseklik, NAP)"
    - "3DBAG b3_h_maaiveld (zemin kotu, NAP)"
    - "3DBAG b3_bouwlagen  (kat sayisi — capraz kontrol)"
  height_definition: "bina_yuksekligi_m = b3_h_dak_max - b3_h_maaiveld"
  height_definition_note: >
    Mutlak z DEGIL, zemin kotuna gore yukseklik. NAP sifirinin atlanmasi
    sistematik ~1 m kayma uretir (AGENTS.md Bolum 14.6, M-007 ornegi).

  # --- Birincil kural (ONAYLANDI) ---
  primary:
    max_building_height_m: 25.0
    target_dz_m: 2.0
    model_height_m: 50.0
    basis: "ENVI-met: 25 dikey hucre x 2 m = 50 m; model tepesi H_max'in >=2 kati"

  # --- ON-KAYITLI YEDEK (ONAYLANDI) ---
  fallback:
    max_building_height_m: 37.5
    target_dz_m: 3.0
    model_height_m: 75.0
    triggers:
      - id: "T-A"
        rule: "Birincil kuralla gecerli aday sayisi == 0"
      - id: "T-B"
        rule: >
          Birincil kuralla gecen adaylarin HICBIRINDE A'nin baskin yukseklik
          sinifi TEMSIL EDILMIYOR (bkz. representation_criterion).
    logic: "T-A VEYA T-B saglanirsa yedek uygulanir"
    reporting: >
      Hangi kural setinin uygulandigi ve hangi tetikleyicinin calistigi
      raporda ACIKCA belirtilir. Rapor "birincil" veya "yedek (T-A / T-B)"
      ifadesini tasimadan kapatilamaz.
    if_fallback_also_fails: >
      Bolum 12.6 failure raporu yazilir ve DURULUR. Esik kendiliginden daha
      fazla gevsetilmez. Bu durumda secenekler kullaniciya sunulur:
      (a) ENVI-met tam lisans (25 hucre siniri kalkar, bkz. P-002),
      (b) C'nin A'yi temsil etme iddiasindan vazgecilip "A'nin dusuk katli
          bolumunu temsil eden alt-alan" olarak yeniden tanimlanmasi,
      (c) dz > 3 m kabul edilmesi (yaya seviyesi cozunurlugu duser).

  # --- "TEMSIL" KRITERI — hesaptan ONCE tanimlandi ---
  representation_criterion:
    purpose: >
      C, A'yi temsil eden bir alt-alandir. Eger A'da baskin olan yapi tipi
      hicbir adayda bulunmuyorsa, secilen C alani A'nin mikroklimasi hakkinda
      yaniltici sonuc uretir — bu yuzden yedek kurala gecilir.

    height_classes:
      - name: laagbouw
        range_m: "<= 10"
        note: "yaklasik 1-3 kat"
      - name: middelhoogbouw
        range_m: "> 10 ve <= 25"
        note: "yaklasik 4-8 kat"
      - name: hoogbouw
        range_m: "> 25"
        note: "9 kat ve uzeri"
    height_classes_rationale: >
      Sinirlar Hollanda yapi pratigindeki laagbouw / middelhoogbouw / hoogbouw
      ayrimina dayanir. 25 m siniri ayrica BIRINCIL KURALIN esigiyle ayni
      secilmistir: boylece "hoogbouw baskinsa birincil kural onu asla temsil
      edemez" iliskisi tanim geregi gorunur olur.
      Capraz kontrol: siniflar b3_bouwlagen ile de raporlanir; yukseklik ve
      kat sayisi birbirini tutmuyorsa fark raporlanir (Bolum 12.10 ikinci yol).

    dominant_class:
      measure: verblijfsobject_share
      definition: >
        A icindeki her yukseklik sinifinin, A'daki toplam VBO icindeki payi.
        Baskin sinif = payi en yuksek olan sinif.
      why_not_building_count: >
        Bina sayisi kucuk sira evler ve yardimci yapilar tarafindan domine edilir;
        200 daireli bir kule tek bir pand olarak sayilir. VBO payi, mahallenin
        fiilen nerede yasadigini yansitir ve D-008'in VBO paydasiyla tutarlidir.
      also_reported: >
        Seffaflik icin ucu de raporlanir: bina sayisi payi, VBO payi ve taban
        alani payi. Karar VBO payina gore verilir; digerleri farkli sonuc
        veriyorsa bu rapora yazilir.

    represented_in_candidate:
      rule: >
        Bir aday, baskin sinifi TEMSIL EDIYOR sayilir ancak ve ancak:
        (1) adayin icinde baskin siniftan en az 1 pand varsa, VE
        (2) baskin sinifin adaydaki VBO payi, ayni sinifin A'daki VBO payinin
            EN AZ YARISI ise.
      threshold_ratio: 0.50
      formula: "share_in_candidate / share_in_A >= 0.50"
      rationale: >
        Tek kosul (1) yetersizdir: tek bir sinir binasi "temsil" sayilmamalidir.
        Tek kosul (2) de yetersizdir: A'daki pay cok kucukse oran kolayca
        saglanir. Ikisi birlikte "sembolik varlik" ile "gercek temsil" ayrimini
        yapar. 0,50 orani bir muhendislik secimidir, olculmus bir esik degildir
        ve boyle kaydedilmistir.

    special_case_hoogbouw:
      note: >
        Baskin sinif hoogbouw (> 25 m) ise, birincil kural (H_max <= 25 m) o
        sinifi TANIM GEREGI iceremez; T-B otomatik olarak tetiklenir ve yedek
        uygulanir. Yedek de (H_max <= 37,5 m) yalnizca 25-37,5 m araligini
        kapsar; A'nin hoogbouw'u 37,5 m'yi asiyorsa yedek de temsil saglayamaz
        ve if_fallback_also_fails yolu isler.

    evaluation_order:
      - "1. A'nin yukseklik dagilimi hesaplanir, siniflar ve baskin sinif belirlenir"
      - "2. Birincil kuralla adaylar taranir"
      - "3. T-A kontrolu: aday sayisi 0 mi?"
      - "4. T-B kontrolu: gecen adaylarin hicbiri baskin sinifi temsil etmiyor mu?"
      - "5. T-A veya T-B ise yedek kuralla tarama TEKRARLANIR"
      - "6. Uygulanan set ve tetikleyici rapora yazilir"

  pre_registration_note: >
    Bu blok, A'nin yukseklik dagilimi HENUZ BILINMEDEN yazilmistir; 3DBAG verisi
    Asama 0.3'te inecektir. Dolayisiyla "baskin sinif" ve "temsil" tanimlari
    sonuca bakilarak ayarlanamamistir. Bu, Bolum 12.2'nin istedigi anlamda
    gercek bir on-kayittir ve git gecmisi bunu kanitlar: bu commit, 3DBAG
    indirme commit'inden ONCEDIR.

# ============================================================================
#  GIRDI KALITE KAPISI — AHN LAZ (Karar D-015, AGENTS.md Bolum 12.12)
#  MUHURLENDI 2026-09-21, HESAPTAN ONCE. Veri indirilmisti ama yogunluk
#  HENUZ OLCULMEMISTI; bu blok olcum sonucuna bakilarak yazilmamistir.
# ============================================================================
input_gate_ahn:
  decision_ref: D-015
  status: SEALED
  sealed_at: "2026-09-21"
  applies_to: "data/raw/ahn/AHN5_T/*.LAZ"
  evaluation_area: "B alani (raporlama A'da, ama girdi kalitesi B'de olculur)"

  # --- Olcum yontemi (hesaptan once sabitlendi) ---
  method:
    grid_cell_m: 10
    statistic: median
    statistic_rationale: >
      Ortalama YANILTIR: su yuzeyi lazer donusu vermez ve ortalamayi asagi ceker.
      A icinde 2,62 ha su var (CBS kara alani 107 ha, geometrik alan 109,62 ha).
      Medyan bu hucrelere karsi dayaniklidir.
    cells_counted: "merkezi B icinde kalan 10x10 m hucreler"
    points_counted: "TUM siniflar (resmi spesifikasyon degerleri de tum donusler uzerindendir)"
    also_reported:
      - p10_density
      - fraction_cells_below_hard_gate_pct
      - fraction_cells_below_expectation_pct
      - zero_return_cells_pct       # su/golge bosluklari
      - building_class_density      # ayrica, LOD2 icin kritik olan alt kume
      - class_distribution          # sinif kodlari VERIDEN okunur, ASPRS VARSAYILMAZ
      - total_points
      - bbox_coverage_gaps

  # --- KADEME 1: SERT KAPI (resmi belgeye dayali) ---
  hard_gate:
    id: "0-E"
    metric: median_point_density_pts_m2
    comparator: ">="
    threshold: 10.0
    unit: pts_m2
    status: LOCKED
    on_fail: "FAIL — Bolum 12.6 uygulanir, Asama 1'e GECILMEZ"
    source: >
      ahn.nl resmi kwaliteitsbeschrijving: "Voor het AHN4 zal de puntdichtheid
      ongeveer 10-14 punten per vierkante meter zijn." 10 bu araligin TABANIDIR.
    source_verified_at: "2026-09-21"
    rationale: >
      AHN5 icin resmi spesifikasyon YOKTUR (belge yalnizca AHN1-AHN4'u kapsar).
      Uygulanabilir tek belgelenmis sayi AHN4'un tabanidir ve AHN5'in ondan kotu
      olmasi beklenmez. Bu yuzden 10, gercek bir kapi degeri olarak degil
      REGRESYON ALARMI olarak konulmustur: altina duserse veri beklenmedik
      bicimde bozuk demektir.

  # --- KADEME 2: BEKLENTI (kendi olcumumuze dayali) ---
  expectation:
    id: "0-F"
    metric: median_point_density_pts_m2
    comparator: ">="
    threshold: 20.0
    unit: pts_m2
    status: LOCKED
    on_fail: "UYARI — arastirilir ve raporlanir; FAIL DEGILDIR, Asama 1 engellenmez"
    source: >
      BIZIM OLCUMUMUZ: kaartblad 37EN1 AHN5 tamami 917.040.516 nokta /
      (5000 m x 6250 m) = 29,3 nokta/m2 (lasinfo basligindan, 2026-09-21).
    source_is_not: >
      AGENTS.md Bolum 2'deki "AHN5 Randstad: >=20 nokta/m2" ifadesi DEGILDIR.
      O ifade kaynaksizdir; resmi kwaliteitsbeschrijving AHN5'i hic kapsamaz
      (olculdu 2026-09-21). Kaynaksiz bir iddiayi esige cevirmek M-005'in
      yasakladigi seydir. 20 degeri, olculen 29,3'un altinda guvenli bir
      beklenti sinirı olarak secilmistir.
    rationale: >
      Sert kapi (10) gercek veriye gore cok gevsek kalir ve yerel seyreklik
      sorunlarini yakalamaz. Beklenti kademesi bu boslugu doldurur ama
      kaynagi zayif oldugu icin FAIL uretmez, UYARI uretir.

  # --- Sinif dagilimi: esik yok, kayit zorunlu ---
  class_distribution:
    threshold: none
    requirement: "Bulunan her sinif kodu ve sayisi DATA_LOG.md'ye yazilir"
    rationale: >
      Sinif kodlari veriden OKUNUR. lasinfo basligi 37EN1 icin classification
      araligini 1..26 olarak gosterdi; ASPRS standardi varsayilmaz cunku AHN
      kendi ek siniflarini kullanabilir (ornek 26).
    lod2_note: >
      LOD2 rekonstruksiyonu icin kritik olan alt kume BINA sinifidir; genel
      yogunluk yuksek ama bina sinifi seyrek olabilir. Bu yuzden bina sinifi
      yogunlugu AYRICA raporlanir (esik yok, Asama 1'de yorumlanacak).

  # --- Kapsama boslugu ---
  coverage:
    metric: zero_return_cells_pct
    threshold: none
    requirement: "Sifir donuslu hucre orani raporlanir ve mekansal dagilimi not edilir"
    rationale: >
      Su yuzeyleri dogal olarak sifir donus verir; bu bir hata DEGILDIR.
      Ancak sifir donuslu hucreler SU DISINDA kumeleniyorsa bu bir veri
      boslugudur ve Asama 1'de o binalarda rekonstruksiyon basarisiz olur.
      Ayrim Asama 1'de BGT su katmaniyla yapilacak; 0.3'te yalnizca oran kaydedilir.

  # --- BINA BAZLI CATI YOGUNLUGU (kullanici talimati; ESIK DEGIL, raporlanir) ---
  per_building_density:
    threshold: none
    scope: "A alanindaki panden (status filtreli, centroid kurali)"
    definition: >
      Bir pandin ayakizi POLIGONU icine dusen nokta sayisi / ayakizi alani (m2).
      Kesisim degil ICINE DUSME; ayakizi disindaki noktalar sayilmaz.
    reported:
      - median_roof_density_pts_m2
      - p10_roof_density_pts_m2
      - buildings_below_10_pts_m2_count
    output_csv: reports/ahn_point_density_by_building.csv
    csv_columns:
      - bag_id                 # identificatie
      - footprint_area_m2
      - point_count            # ayakizi icindeki TUM siniflar
      - roof_density_pts_m2
      - below_10               # true/false
      - has_dwellings          # aantal_verblijfsobjecten > 0
      # --- EK (2026-09-21, kullanici talimati; ESIK DEGIL, raporlanir) ---
      - building_class_points  # ayakizi icinde YALNIZCA sinif 6 (bina) noktalari
      - building_class_ratio   # building_class_points / point_count

  # --- SINIF 6 ORANI (2026-09-21 eklendi; ESIK DEGIL, raporlanir) ---
  # Bu blok, olcum ZATEN yapildiktan SONRA eklenmistir. Eklenmesi Bolum 12.2'yi
  # ihlal ETMEZ cunku bir ESIK DEGILDIR ve hicbir PASS/FAIL kararina girmez;
  # var olan bir esigi de gevsetmez. Yeni bir RAPORLAMA sutunudur.
  per_building_class_ratio:
    threshold: none
    added_at: "2026-09-21"
    added_by: "kullanici talimati"
    definition: >
      Bir pandin ayakizi poligonu ICINE DUSEN (within) sinif 6 noktalarinin,
      ayni poligona dusen TUM sinif noktalarina orani.
    rationale: >
      Mevcut roof_density_pts_m2 ayakizi icindeki TUM siniflari sayar. Catiyi
      orten agac noktalari (sinif 1 / siniflandirilmamis) de "cati noktasi"
      olarak sayilir. Bu, tam da rekonstruksiyonun bozulmasi beklenen binalarda
      yogunlugun IYI gorunmesine yol acar - yani metrik en cok ihtiyac duyulan
      yerde yaniltir. Sinif 6 orani bu kor noktayi kapatir.
    interpretation: >
      DUSUK oran = cati muhtemelen bitki ortusuyle kapali VEYA siniflandirma
      eksik. Tek basina hata DEGILDIR; Asama 1'de failed_buildings.csv ile
      KARSILASTIRILACAK ucuncu eksendir (yogunluk, sinif orani, basari).
    undefined_case: >
      point_count = 0 olan binalarda oran TANIMSIZDIR; CSV'de bos birakilir ve
      en dusuk 10 listesine ALINMAZ (0/0 yapay olarak 0 gosterilmez).
    reported:
      - lowest_10_building_class_ratio   # raporda tablo olarak

  # --- GORSEL DOGRULAMA ORNEKLEMI (D-019, AGENTS.md Bolum 12.13) ---
  # Sinif 6 orani sifir cikan yapilarin NE OLDUGU bir CIKARIMDIR; karardan
  # once bagimsiz yoldan (Luchtfoto / Street View) dogrulanir. Orneklem
  # tekrarlanabilir olmak zorundadir, bu yuzden seed BURAYA yazilir.
  visual_check:
    decision_ref: D-019
    seed: 28992                    # RD New EPSG kodu; anlamli bir sabit
    n_small: 10                    # rastgele secilen kucuk yapi (< 100 m2)
    n_big: 2                       # iki okul - HER ZAMAN dahil, rastgele DEGIL
    big_always_include:
      - "0503100000041285"         # 1.665,0 m2 - onderwijs + sport, bouwjaar 2026
      - "0503100000038184"         #   996,5 m2 - onderwijs, bouwjaar 2023
    big_rationale: >
      Bu ikisi orneklemde KALIR cunku gorsel kontrol burada ikinci bir ise
      yarar: guncel Luchtfoto'da (2025/2026) okul binasi GORUNUYORSA,
      "ucustan sonra yapildi" aciklamasi bagimsiz olarak dogrulanmis olur.
      Yani ayni orneklem hem A hem B alt grubunu sinar.
    labels: ["depo/kulube", "ev", "baska", "goruntude yok"]
    output_geojson: aoi/qa/zero_class6_buildings.geojson
    output_csv: reports/visual_check_sample.csv
    result_doc: docs/visual_check_zero_class6.md
    blocks: "P-012 (P-013 BEKLEMEZ - dogrudan olcume dayanir, D-019)"
    csv_scope_note: >
      CSV TUM A binalarini icerir, yalnizca esik altindakileri degil. Kullanici
      "esik altinda kalanlar" istemisti; tam liste bunun ust kumesidir ve Asama 1
      karsilastirmasi icin daha kullanislidir (basarisiz rekonstruksiyonlar esik
      ustundeki binalarda da cikabilir — o durumda neden girdi DEGILDIR ve bu da
      bir bulgudur). `below_10` sutunu istenen alt kumeyi verir.
    purpose: >
      AGENTS.md Bolum 12.12'nin somut uygulamasi. Asama 1'de basarisiz
      rekonstruksiyon listesi (reports/failed_buildings.csv) bu CSV ile
      KARSILASTIRILACAK:
        - basarisiz VE dusuk yogunluklu  -> neden muhtemelen GIRDI
        - basarisiz AMA yeterli yogunluklu -> neden muhtemelen YONTEM
      Bu ayrim sonradan yapilamaz; girdi kalitesi o zamana kadar olculmemis olur.
    why_no_threshold: >
      Esik konulmadi cunku dusuk catı yogunlugu tek basina bir HATA DEGILDIR —
      kucuk veya egimli catili binalarda dogal olarak az nokta duser. Deger,
      Asama 1 sonuclariyla BIRLIKTE yorumlandiginda anlam kazanir.
